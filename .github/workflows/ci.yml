name: CI

# プルリクエストと main への push で、CLAUDE.md の検証コマンドを一通り走らせる。
# 型検査・テスト・ビルドはそれぞれ検出できる不具合の層が違うため、3つとも実行する。
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型検査・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型検査 (npm run lint)
        run: npm run lint

      - name: テスト (npm test)
        run: npm test

      - name: ビルド (npm run build)
        run: npm run build
