name: CI

# プルリクエストと main への push で、CLAUDE.md の検証コマンドを一通り走らせる。
# 型検査・テスト・ビルドはそれぞれ検出できる不具合の層が違うため、3つとも実行する。
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 検証しかしないジョブなので、GITHUB_TOKEN は読み取りだけに絞る
permissions:
  contents: read

jobs:
  verify:
    name: 型検査・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型検査 (npm run lint)
        run: npm run lint

      - name: テスト (npm test)
        run: npm test

      - name: ビルド (npm run build)
        run: npm run build

      # 画面をつないで操作したときだけ壊れる不具合は、型検査もテストもすり抜ける。
      # ビルド済みのサーバーを立てて、主要な画面を一通り触る
      - name: ブラウザの用意
        run: npx playwright install --with-deps chromium

      - name: 画面の通し確認 (npm run test:e2e)
        run: npm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
