      <h1>英単語クエスト｜中学〜大学レベルの無料英単語学習アプリ</h1>
      <p>
        英単語クエストは、中学レベル（A1）から大学・社会人レベル（C1/C2）まで<strong>約7,800語</strong>を収録した、登録不要・完全無料の英単語学習ウェブアプリです。
        忘却曲線にもとづく間隔反復（SRS）で復習タイミングを最適化し、発音記号と音声、レベル別の一問一答・例文穴埋めクイズを通じて、
        難関大学受験・英検・TOEIC・TOEFL対策に必要な語彙を効率よく定着させられます。
      </p>

      <h2>収録レベルと単語数</h2>
      <ul>
        <li><strong>初級（中学）</strong>：約1,060語 — 教科書レベルの基礎単語</li>
        <li><strong>中級1（高校1年）</strong>：約1,175語 — 高校英語の土台となる語彙</li>
        <li><strong>中級2（高校2年）</strong>：約1,404語 — 共通テスト水準の語彙</li>
        <li><strong>中級3（高校3年）</strong>：約1,645語 — 難関大入試に頻出の語彙</li>
        <li><strong>上級</strong>：約2,467語 — TOEIC・TOEFL・ビジネス英語の語彙</li>
      </ul>

      <h2>主な機能</h2>
      <ul>
        <li><strong>間隔反復（SRS）による復習</strong>：忘れかけたタイミングで自動的に再出題し、記憶を長期定着させます。</li>
        <li><strong>4種類のクイズ</strong>：英単語の意味を選ぶ一問一答、例文の穴埋め、音声だけで解くリスニング、長文読解に対応。</li>
        <li><strong>単語辞書一覧</strong>：全収録語をレベル別・キーワードで検索でき、意味・例文・発音・イメージ画像を確認できます。</li>
        <li><strong>発音記号と音声読み上げ</strong>：正しい発音を耳と目で確認しながら覚えられます。</li>
        <li><strong>AI学習支援</strong>：AIが単語の使用頻度やシチュエーション別の使われ方、類義語・反意語・コロケーションを解説します。</li>
        <li><strong>学習カレンダー・苦手単語の自動記録</strong>：間違えた単語を自動で蓄積し、弱点だけを集中的に復習できます。</li>
        <li><strong>自分だけの単語追加</strong>：AI・CSV・PDFから独自の単語帳を作成して出題できます。</li>
      </ul>

      <h2>使い方</h2>
      <ol>
        <li>学習したいレベル（中学〜上級）を選びます。</li>
        <li>一問一答・例文穴埋め・リスニングから出題形式を選んでクイズを開始します。</li>
        <li>間違えた単語は自動的に苦手単語として記録されます。</li>
        <li>翌日以降、「今日の復習」から最適なタイミングで再挑戦します。</li>
        <li>「単語一覧辞書」でいつでも意味・例文・発音を確認できます。</li>
      </ol>

      <h2>よくある質問</h2>
      <p><strong>Q. 料金はかかりますか？</strong><br />A. いいえ。すべての機能を無料でご利用いただけます。</p>
      <p><strong>Q. 会員登録は必要ですか？</strong><br />A. 不要です。学習データはお使いの端末（ブラウザ）内に保存されます。</p>
      <p><strong>Q. スマートフォンでも使えますか？</strong><br />A. はい。スマートフォン・タブレット・パソコンのブラウザで動作し、ホーム画面に追加してアプリのように使えます。</p>
